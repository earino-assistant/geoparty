# CI for GeoParty. The site is static and no-build, so CI is deliberately
# tiny: syntax-check every ES module, then run the Node test suite (which
# also validates data/location_pool.json). No npm install — zero deps.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax-check all modules
        run: npm run check

      - name: Run tests
        run: npm test
