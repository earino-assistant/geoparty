# GitHub Pages deployment (field-observability plan §11).
#
# The site stays static and no-build: this ONE workflow checks out the repo,
# runs the same checks CI runs, writes ONE generated file into the upload
# artifact — release.json — and deploys. Nothing is ever committed per
# deploy, and a plain checkout (or file://) simply has no release.json, so
# the dev loop is unchanged and js/consent.js stamps `release: "dev"`.
#
# ONE branch matters: main. A production deploy runs on a push to main (or a
# manual workflow_dispatch, which always runs on main) — a single site
# assembled from one branch tip, with no nested candidate route. The delivery
# rationale and the incident it comes from are recorded in docs/architecture.md
# (Deployment) and the delivery-architecture audit it links.
#
# INVARIANT: this repo has exactly ONE Pages deploy workflow, and it is this
# file, edited in place. A second workflow touching the `pages` concurrency
# group is the dueling-deploy hazard the audit forbids (tests/deploy-
# workflow.test.js pins this). ci.yml stays the untouched PR gate.
#
# GREEN MEANS LIVE: a `verify` job (below) polls the public root release.json
# after deploy and fails the run unless it stamps THIS run's id and sha. This
# is the one lesson the delivery-architecture audit proved beyond doubt — a
# green deployment record is NOT a public endpoint change; only the public
# stamp is the activation oracle. The workflow enforces it so a run cannot go
# green without the site actually changing.
#
# One-time setup by the owner: Settings → Pages → Source = "GitHub Actions".
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write the Pages deployment, mint the OIDC
# token deploy-pages needs. No contents:write — nothing is pushed back.
permissions:
  contents: read
  pages: write
  id-token: write

# One live deployment at a time; never cancel a run that is mid-deploy. This
# also protects `verify`: the group is held until the whole run — verify
# included — completes, so no newer run can overwrite the stamp mid-poll.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The same gate as CI — a broken module never reaches production.
      - name: Syntax-check all modules
        run: npm run check

      - name: Run tests
        run: npm test

      # The release stamp. Artifact-only: `release.json` is in .gitignore, so
      # it can never be committed by accident. consent.js fetches it after a
      # successful (consented) PostHog init and registers release/commit/
      # deployed_at as super properties, so every event, exception and replay
      # is attributable to an exact deploy. The `run` field is what the verify
      # job below matches against.
      - name: Stamp the release
        run: |
          node -e '
            const fs = require("fs");
            const sha = process.env.GITHUB_SHA || "";
            fs.writeFileSync("release.json", JSON.stringify({
              commit: sha,
              short: sha.slice(0, 7) || "dev",
              deployed_at: new Date().toISOString(),
              run: process.env.GITHUB_RUN_ID || "",
              env: "pages",
            }) + "\n");
          '
          cat release.json

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Green means live. Poll the PUBLIC root release.json until it stamps this
  # run's id and sha; fail the run if it never does. It depends on deploy, so
  # it is skipped when deploy fails, and reads nothing but a public URL, so it
  # holds no elevated permission.
  verify:
    needs: deploy
    runs-on: ubuntu-latest
    # Backstop above the in-script ~5 min budget.
    timeout-minutes: 8
    # This job only fetches a public URL — no Pages, OIDC, or contents scope.
    permissions: {}
    steps:
      - name: Verify the public release stamp activated
        run: |
          url="https://earino-assistant.github.io/geoparty/release.json"
          echo "Expecting run=$GITHUB_RUN_ID commit=$GITHUB_SHA at $url"
          body=""
          # 30 attempts, 10s apart (~5 min) — ~10-20x the observed ~15-30s
          # activation latency and past the 10-min edge cache.
          for attempt in $(seq 1 30); do
            # Fresh cache-busting query EVERY attempt: Pages serves
            # cache-control: max-age=600 via Fastly and custom headers cannot
            # be configured, so Fastly caches per full URL. A UNIQUE query per
            # attempt lets each poll observe fresh origin state; reusing one
            # query could pin a stale/404 answer in the edge for up to 10 min.
            # This is the core false-red defense (audit §2.1).
            body=$(curl -fsS "$url?verify=$GITHUB_RUN_ID-$attempt" || true)
            # Fixed-string match on the single-line JSON stamp: BOTH the run
            # and the commit must be this run's (order-independent).
            if printf '%s' "$body" | grep -qF "\"run\":\"$GITHUB_RUN_ID\"" \
               && printf '%s' "$body" | grep -qF "\"commit\":\"$GITHUB_SHA\""; then
              echo "Verified: production is publicly serving run $GITHUB_RUN_ID."
              exit 0
            fi
            echo "Attempt $attempt/30: stamp not live yet; sleeping 10s."
            sleep 10
          done
          echo "::error::Public release stamp did not match after 30 attempts (~5 min)."
          echo "Expected run=$GITHUB_RUN_ID commit=$GITHUB_SHA"
          echo "Last body fetched: ${body:-<empty>}"
          echo "A RED verify means the NEW deployment did not publicly activate."
          echo "The PREVIOUS deployment is STILL being served — the site is NOT down."
          echo "Remedy: investigate, then RE-RUN failed jobs. A re-run re-polls"
          echo "under this same run id, so late propagation turns it green"
          echo "without redeploying."
          exit 1
